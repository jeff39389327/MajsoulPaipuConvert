# 在 Windows 上全凍結打包 GUI（PyInstaller backend.exe + electron-builder NSIS），
# 並把產生的安裝檔上傳到 GitHub Releases 的 rolling「latest」預發佈版。
#
# 外部相依（打包前取得）：
#   - tensoul-py-ng：已直接納入本 repo（MIT），checkout 即帶著，毋需另外取得。
#   - mjai-reviewer.exe：從 Equim-chan/mjai-reviewer 的 Releases 下載 Windows 版。
#   - Chrome 瀏覽器：執行期才需要（爬取 ID），打包不需要。
name: build-release

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

# 同一分支的舊建置自動取消，避免堆疊
concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      MJAI_REPO: Equim-chan/mjai-reviewer
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Python deps + PyInstaller
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # requirements 釘了 obsolete 的 PyPI backport asyncio==3.4.3，會遮蔽並破壞
          # 3.11 內建的 asyncio；移除以使用標準庫版本。
          pip uninstall -y asyncio
          pip install pyinstaller

      - name: Download bundled mjai-reviewer.exe
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          New-Item -ItemType Directory -Force -Path gui/vendor | Out-Null
          New-Item -ItemType Directory -Force -Path mjai_tmp | Out-Null
          # mjai-reviewer 的 release 全部標記為 prerelease，`gh release download`（取 latest）
          # 會回 "release not found"。改用 API 列出所有 release，挑最新一個含 Windows zip 的資產。
          $headers = @{
            'User-Agent'    = 'gh-actions'
            'Accept'        = 'application/vnd.github+json'
            'Authorization' = "Bearer $env:GH_TOKEN"
          }
          $releases = Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/$env:MJAI_REPO/releases?per_page=20"
          $asset = $null
          foreach ($r in $releases) {
            $a = $r.assets | Where-Object { $_.name -match 'windows' -and $_.name -match '\.zip$' } | Select-Object -First 1
            if ($a) { $asset = $a; break }
          }
          if ($null -eq $asset) { Write-Error "找不到 mjai-reviewer 的 Windows zip 資產"; exit 1 }
          Write-Host "下載資產: $($asset.name)"
          # browser_download_url 會轉址到 githubusercontent；下載本身不帶 Authorization（帶了會被拒）。
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile mjai_tmp/mjai.zip
          Expand-Archive -Path mjai_tmp/mjai.zip -DestinationPath mjai_tmp/extracted -Force
          # 預編譯執行檔可能叫 mjai-reviewer.exe 或 akochan-reviewer.exe（mjai-reviewer 的前身），
          # 對 `--no-review --mjai-out` 的純轉換用法相容；取任一 reviewer exe，統一命名為 mjai-reviewer.exe。
          $exe = Get-ChildItem mjai_tmp/extracted -Recurse -Include 'mjai-reviewer.exe', 'akochan-reviewer.exe' | Select-Object -First 1
          if ($null -eq $exe) { $exe = Get-ChildItem mjai_tmp/extracted -Recurse -Filter '*reviewer*.exe' | Select-Object -First 1 }
          if ($null -eq $exe) { Write-Error "解壓後找不到 reviewer 執行檔"; exit 1 }
          Copy-Item $exe.FullName gui/vendor/mjai-reviewer.exe -Force
          Write-Host "已放置 gui/vendor/mjai-reviewer.exe (來源: $($exe.Name))"

      - name: Backend smoke test (NDJSON protocol)
        shell: pwsh
        run: node gui/test/smoke.js
        env:
          PYTHON: python

      # electron-updater 以 latest.yml 的 version 欄位（非 tag）比對是否有新版，故每次建置都要
      # 遞增版本，否則已安裝的使用者永遠偵測不到更新。用單調遞增的 run_number 當 patch 版號。
      - name: Bump GUI version for auto-update
        shell: pwsh
        working-directory: gui
        run: npm version "0.1.${{ github.run_number }}" --no-git-tag-version --allow-same-version

      - name: Install GUI deps & build (freeze backend + electron-builder)
        shell: pwsh
        working-directory: gui
        env:
          PYTHONUTF8: '1'
          PYTHONIOENCODING: utf-8
        run: |
          npm install
          npm run dist

      - name: Collect installer
        id: collect
        shell: pwsh
        run: |
          $exe = Get-ChildItem dist_gui -Recurse -Filter *.exe | Select-Object -First 1
          if ($null -eq $exe) { Write-Error "dist_gui 內找不到輸出的 .exe"; exit 1 }
          Write-Host "built: $($exe.FullName)"
          # auto-update 元資料：electron-builder 產生的 latest.yml 必須隨安裝檔一起發佈，
          # electron-updater 才能抓到 {releaseUrl}/latest.yml 比對版本。
          if (-not (Test-Path dist_gui/latest.yml)) { Write-Error "dist_gui 內找不到 latest.yml（auto-update 必需）"; exit 1 }
          # 發佈前的根因防線：GitHub 上傳 release 資產時，會把檔名裡「非 [A-Za-z0-9._-]」的字元
          # （最典型是空格）改寫（空格→點），但 latest.yml 內仍是原檔名 → 用戶端下載 URL 一律 404。
          # 0.1.27 就是這樣壞掉的。artifactName 已改成無空格的連字號檔名；此處在「刪除舊 release、
          # 發佈新 release」等破壞性步驟之前先擋一次，確保未來若有人改壞 artifactName，是在 feed
          # 上線前 CI 就失敗，而不是把壞掉的更新推給所有使用者。
          if ($exe.Name -notmatch '^[A-Za-z0-9._-]+$') {
            Write-Error "安裝檔名 '$($exe.Name)' 含 GitHub 會改寫的字元（如空格）；上傳後資產名將與 latest.yml 不符，auto-update 會 404。請修正 package.json 的 build.artifactName。"
            exit 1
          }
          Write-Host "installer 檔名對 GitHub 資產命名安全: $($exe.Name)"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MajsoulPaipuGUI-windows
          path: |
            dist_gui/*.exe
            dist_gui/latest.yml
            dist_gui/*.blockmap
          if-no-files-found: error

      # rolling 'latest' 預發佈版：先刪掉舊的 release 與 tag，下一步才會在「目前的 commit」重建。
      # 否則 (a) softprops 不會移動既有 tag，release 會一直掛在舊 commit；(b) 若有人手動刪了
      # release，殘留的舊 tag 會讓後續 release 仍掛在過時 commit。刪除失敗（不存在）即略過。
      - name: Reset rolling 'latest' release + tag
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes 2>$null
          gh api -X DELETE "repos/$env:GITHUB_REPOSITORY/git/refs/tags/latest" 2>$null
          exit 0

      - name: Publish to Releases (rolling latest)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          target_commitish: ${{ github.sha }}
          name: Latest build
          prerelease: true
          body: |
            自 `main` 自動建置的最新 Windows 安裝檔。
            Commit: ${{ github.sha }}
            Version: 0.1.${{ github.run_number }}
          files: |
            dist_gui/*.exe
            dist_gui/latest.yml
            dist_gui/*.blockmap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 發佈後的第二道防線（主防線是上面 Collect 的發佈前檔名檢查）：確認 latest.yml 宣告的每個
      # 下載目標，在 release 上都有同名、同大小的資產。這裡驗證的是 electron-updater 真正會下載的
      # files[].url（getFileList 只要 files 陣列存在就用它，top-level path 僅為空陣列時的後備），
      # 而非只看 path——0.1.27 兩者剛好都壞，但正確的檢查必須對準實際下載欄位。此步另可抓到上傳
      # 截斷（大小不符）與意料外的檔名改寫。API 剛發佈可能短暫看不到資產，故加重試。
      - name: Verify update feed consistency
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 逐行解析 latest.yml：收集 files[] 內每個 (url, size)，並補上 top-level path 作為後備目標。
          $lines = Get-Content dist_gui/latest.yml
          $targets = @()
          $inFiles = $false
          $curUrl = $null
          foreach ($line in $lines) {
            if ($line -match '^files:\s*$') { $inFiles = $true; continue }
            if ($inFiles -and $line -match '^\S') { $inFiles = $false }  # 遇到下一個 top-level key，files 區塊結束
            if ($inFiles) {
              if ($line -match '^\s*-\s*url:\s*(.+?)\s*$') { $curUrl = $Matches[1] }
              elseif ($line -match '^\s*size:\s*(\d+)\s*$' -and $curUrl) {
                $targets += [pscustomobject]@{ name = $curUrl; size = [int64]$Matches[1] }
                $curUrl = $null
              }
            }
          }
          $ymlRaw = ($lines -join "`n")
          if ($ymlRaw -match '(?m)^path:\s*(\S.*?)\s*$') {
            $pathName = $Matches[1]
            if (-not ($targets | Where-Object { $_.name -eq $pathName })) {
              $targets += [pscustomobject]@{ name = $pathName; size = $null }  # size 未知就只驗存在
            }
          }
          if ($targets.Count -eq 0) { Write-Error "latest.yml 解析不到任何下載目標（files[].url / path）"; exit 1 }
          Write-Host ("latest.yml 下載目標: " + (($targets | ForEach-Object { "$($_.name)($($_.size))" }) -join ', '))

          $headers = @{
            'Authorization' = "Bearer $env:GH_TOKEN"
            'Accept'        = 'application/vnd.github+json'
            'User-Agent'    = 'gh-actions'
          }
          $uri = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/tags/latest"
          # 剛發佈時 API 可能短暫還看不到全部資產：重試最多 5 次、每次間隔 5 秒。
          $assets = @()
          for ($i = 1; $i -le 5; $i++) {
            try { $rel = Invoke-RestMethod -Headers $headers -Uri $uri } catch { $rel = $null }
            $assets = if ($rel -and $rel.assets) { @($rel.assets) } else { @() }
            $names = @($assets | ForEach-Object { $_.name })
            $missing = @($targets | Where-Object { $names -notcontains $_.name })
            if ($assets.Count -gt 0 -and $missing.Count -eq 0) { break }
            Write-Host "資產尚未完整可見（嘗試 $i/5），5 秒後重試…"
            Start-Sleep -Seconds 5
          }
          Write-Host ("release 資產: " + ((@($assets | ForEach-Object { $_.name })) -join ', '))

          $failed = $false
          foreach ($t in $targets) {
            $asset = $assets | Where-Object { $_.name -eq $t.name } | Select-Object -First 1
            if ($null -eq $asset) {
              Write-Host "::error::latest.yml 指向 '$($t.name)'，但 release 資產中不存在（GitHub 可能改寫了檔名，如空格→點）。用戶端 auto-update 會 404。"
              $failed = $true
            } elseif ($t.size -ne $null -and $asset.size -ne $t.size) {
              Write-Host "::error::資產 '$($t.name)' 大小 $($asset.size) 與 latest.yml 宣告的 $($t.size) 不符（上傳不完整？）。"
              $failed = $true
            }
          }
          if ($failed) { Write-Error "update feed 一致性檢查失敗，見上方錯誤。"; exit 1 }
          Write-Host "OK: 所有下載目標檔名與大小一致，auto-update 可正常下載。"
